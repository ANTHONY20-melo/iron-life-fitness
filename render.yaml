services:
  - type: web
    name: iron-life-api
    region: oregon
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iron-life-db
          property: connectionString
      - key: JWT_SECRET
        value: iron-life-production-jwt-secret-2026-xk9m7q3p
      - key: JWT_REFRESH_SECRET
        value: iron-life-production-refresh-secret-2026-xk9m7q3p
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 3340
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://web-six-orcin-16.vercel.app
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: iron-life-db
    region: oregon
    plan: free
    postgresVersion: "16"
