version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ironlife-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iron_life_fitness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ironlife-backend
    restart: unless-stopped
    ports:
      - "3340:3340"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/iron_life_fitness?schema=public"
      JWT_SECRET: "iron-life-prod-jwt-secret-change-me"
      JWT_REFRESH_SECRET: "iron-life-prod-refresh-secret-change-me"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: "3340"
      NODE_ENV: "production"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ironlife-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
